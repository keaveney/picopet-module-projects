<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 650" role="img"><title>Parallel CNN branches and conditional-density outputs</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56766d"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#183c42;font-size:17px}.small{font-size:14px;fill:#4a6467}.bold{font-weight:700}.line{stroke:#56766d;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="28" y="32" class="bold" text-anchor="start">The current conditional-density network</text><rect x="306" y="58" width="288" height="70" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="450.0" y="85" class="bold" text-anchor="middle">8 × 8 photoelectron map</text><text x="450.0" y="109" class="small" text-anchor="middle">1 input channel</text><path class="line" d="M450 128 L158 173"/><rect x="28" y="179" width="260" height="92" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="158.0" y="206" class="bold" text-anchor="middle">2 × 2 convolution</text><text x="158.0" y="230" class="small" text-anchor="middle">8 channels · ReLU</text><text x="158.0" y="254" class="small" text-anchor="middle">Adaptive pooling → 2 × 2</text><path class="line" d="M158 271 L450 312"/><path class="line" d="M450 128 L455 173"/><rect x="325" y="179" width="260" height="92" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="455.0" y="206" class="bold" text-anchor="middle">4 × 4 convolution</text><text x="455.0" y="230" class="small" text-anchor="middle">8 channels · ReLU</text><text x="455.0" y="254" class="small" text-anchor="middle">Adaptive pooling → 2 × 2</text><path class="line" d="M455 271 L450 312"/><path class="line" d="M450 128 L752 173"/><rect x="622" y="179" width="260" height="92" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="752.0" y="206" class="bold" text-anchor="middle">8 × 8 convolution</text><text x="752.0" y="230" class="small" text-anchor="middle">8 channels · ReLU</text><text x="752.0" y="254" class="small" text-anchor="middle">Adaptive pooling → 2 × 2</text><path class="line" d="M752 271 L450 312"/><rect x="277" y="317" width="346" height="58" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="450.0" y="344" class="bold" text-anchor="middle">Concatenate → 96 entries</text><path class="line" d="M450 375 L450 409"/><rect x="277" y="413" width="346" height="58" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="450.0" y="440" class="bold" text-anchor="middle">Linear → 64 · ReLU</text><path class="line" d="M450 471 L450 505"/><rect x="216" y="509" width="468" height="82" rx="10" fill="#faf0d9" stroke="#bccfc5"/><text x="450.0" y="536" class="bold" text-anchor="middle">Linear → 4 + 3K outputs</text><text x="450.0" y="560" class="small" text-anchor="middle">x/y Gaussian parameters + z mixture parameters</text><text x="450" y="625" class="small" text-anchor="middle">Read and evaluate saved parameters now; train a model later.</text></svg>