<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 575" role="img"><title>Measurement and truth branches joined into feature CSVs</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56766d"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#183c42;font-size:17px}.small{font-size:14px;fill:#4a6467}.bold{font-weight:700}.line{stroke:#56766d;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="28" y="32" class="bold" text-anchor="start">What is measured, and what is truth?</text><rect x="310" y="56" width="290" height="58" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="455.0" y="83" class="bold" text-anchor="middle">Simulated gamma interaction</text><path class="line" d="M390 114 L210 150"/><path class="line" d="M520 114 L700 150"/><rect x="40" y="155" width="340" height="80" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="210.0" y="182" class="bold" text-anchor="middle">Optical branch</text><text x="210.0" y="206" class="small" text-anchor="middle">Scintillation → entering photons</text><rect x="530" y="155" width="340" height="80" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="700.0" y="182" class="bold" text-anchor="middle">Truth branch</text><text x="700.0" y="206" class="small" text-anchor="middle">Primary gamma step records</text><path class="line" d="M210 235 L210 272"/><path class="line" d="M700 235 L700 272"/><rect x="40" y="276" width="340" height="82" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="210.0" y="303" class="bold" text-anchor="middle">Channel assignment + PDE</text><text x="210.0" y="327" class="small" text-anchor="middle">64 photoelectron counts</text><rect x="530" y="276" width="340" height="82" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="700.0" y="303" class="bold" text-anchor="middle">Local-deposit filter + earliest step</text><text x="700.0" y="327" class="small" text-anchor="middle">Selected x, y, z label</text><path class="line" d="M210 358 L355 400"/><path class="line" d="M700 358 L560 400"/><rect x="310" y="403" width="290" height="82" rx="10" fill="#edf4ef" stroke="#bccfc5"/><text x="455.0" y="430" class="bold" text-anchor="middle">Join within the same job</text><text x="455.0" y="454" class="small" text-anchor="middle">Feature / truth CSV</text><text x="455" y="521" class="bold" text-anchor="middle">LOCAL ROUTE STARTS WITH EXISTING CSV PRODUCTS</text><text x="455" y="552" class="small" text-anchor="middle">Separate saved predictions → evaluation of residuals and uncertainty</text></svg>